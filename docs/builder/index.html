<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Locate tutorial builder</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,300i,400,400i,500,500i,700,700i%7CJetBrains+Mono:400,400i,700,700i&amp;display=fallback">
  <link rel="stylesheet" href="builder.css">
</head>
<body>
  <header>
    <h1><a class="logo" href="https://ai.hotosm.org"><img src="fair-logo.svg" alt="fAIr" width="24" height="24"></a>Locate tutorial builder</h1>
    <nav><a href="area.html">Area finder</a><a href="index.html" aria-current="page">Tutorial builder</a><a href="mosaic.html">Imagery merger</a><a href="results.html">Results map</a><a href="boxes.html">Auto labeller</a><a href="../">Back to the guides</a></nav>
  </header>

  <main>
    <form id="setup">
      <div class="card">
        <h2>Load the project tiles</h2>
        <label>
          <span>Tile URL</span>
          <input id="tile-url" type="url" placeholder="https://.../{z}/{x}/{y}..." required>
        </label>
        <label>
          <span>Processed tasks file</span>
          <input id="tasks-file" type="file" accept=".geojson,.json" required>
        </label>
        <div class="actions">
          <button type="submit">Load</button>
          <button id="cancel" type="button" class="secondary">Cancel</button>
        </div>
        <p id="setup-status" aria-live="polite"></p>
        <button id="example" type="button" class="link">Try the Banepa example</button>
      </div>
    </form>
    <div id="map"></div>
    <aside>
      <div id="summary"><span id="summary-text"></span><button id="change" type="button" class="secondary">Change</button></div>
      <p id="status" aria-live="polite"></p>
      <fieldset id="sub-grid-sizes" class="choices">
        <legend>Sub-grid</legend>
        <label><input type="radio" name="sub-grid" value="2"> 2x2</label>
        <label><input type="radio" name="sub-grid" value="4" checked> 4x4</label>
        <label><input type="radio" name="sub-grid" value="8"> 8x8</label>
      </fieldset>
      <div id="editor" hidden>
        <h2 id="editor-title"></h2>
        <div id="tile">
          <img id="tile-image" alt="Imagery of the selected task">
          <div id="cells"></div>
        </div>
        <p class="legend">
          <span>Click a cell to change it:</span>
          <span><span class="swatch answer-0"></span>No</span>
          <span><span class="swatch answer-1"></span>Single Feature</span>
          <span><span class="swatch answer-2"></span>Multiple Features</span>
        </p>
        <button id="remove" type="button" class="secondary">Remove scenario</button>
      </div>
      <ol id="scenario-list"></ol>
      <button id="download" type="button" disabled>Download scenarios</button>
    </aside>
  </main>
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
