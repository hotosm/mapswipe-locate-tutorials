<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Locate mosaic helper</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="builder.css">
</head>
<body>
  <header>
    <h1>Locate mosaic helper</h1>
    <nav><a href="area.html">Area helper</a> · <a href="index.html">Scenario builder</a> · <a href="results.html">Results helper</a> · <a href="../">Back to the guides</a></nav>
  </header>

  <form id="setup">
    <fieldset>
      <legend>1. Images from imagery.hotosm.org (link, Copy TMS URL or ID)</legend>
      <div id="image-inputs"></div>
      <button id="add-image" type="button" class="secondary">Add image</button>
    </fieldset>
    <button type="submit">Merge</button>
    <button id="example" type="button" class="secondary">Load Banepa example</button>
  </form>

  <main>
    <div id="map"></div>
    <aside>
      <p id="status">Add two or more images, then click Merge. The newest image is drawn on top where they overlap.</p>
      <dl id="details" hidden>
        <dt>Tile URL for the manager</dt>
        <dd><code id="tile-url"></code></dd>
        <dt>Images</dt>
        <dd><ol id="image-list"></ol></dd>
      </dl>
      <button id="copy" type="button" disabled>2. Copy tile URL</button>
    </aside>
  </main>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script type="module" src="mosaic.js"></script>
</body>
</html>
