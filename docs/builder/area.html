<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Locate area finder</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,300i,400,400i,500,500i,700,700i%7CJetBrains+Mono:400,400i,700,700i&amp;display=fallback">
  <link rel="stylesheet" href="builder.css">
</head>
<body>
  <header>
    <h1><a class="logo" href="https://ai.hotosm.org"><img src="fair-logo.svg" alt="fAIr" width="24" height="24"></a>Locate area finder</h1>
    <nav><a href="area.html" aria-current="page">Area finder</a><a href="index.html">Tutorial builder</a><a href="mosaic.html">Imagery merger</a><a href="results.html">Results map</a><a href="boxes.html">Auto labeller</a><a href="../">Back to the guides</a></nav>
  </header>

  <main>
    <form id="setup">
      <div class="card">
        <h2>Load an image</h2>
        <label>
          <span>Image from imagery.hotosm.org</span>
          <input id="image" type="text" placeholder="Browse link, TMS URL or image ID" required>
        </label>
        <div class="actions">
          <button type="submit">Load</button>
          <button id="cancel" type="button" class="secondary">Cancel</button>
        </div>
        <p id="setup-status" aria-live="polite"></p>
        <button id="example" type="button" class="link">Try the Banepa example</button>
      </div>
    </form>
    <div id="map"></div>
    <aside>
      <div id="summary"><span id="summary-text"></span><button id="change" type="button" class="secondary">Change</button></div>
      <p id="status" aria-live="polite"></p>
      <fieldset id="zoom-levels" class="choices">
        <legend>Project zoom</legend>
        <label><input type="radio" name="zoom" value="18"> 18</label>
        <label><input type="radio" name="zoom" value="19"> 19</label>
        <label><input type="radio" name="zoom" value="20" checked> 20</label>
        <label><input type="radio" name="zoom" value="21"> 21</label>
      </fieldset>
      <dl id="details" hidden>
        <dt>Tile URL for the manager</dt>
        <dd><code id="tile-url"></code></dd>
        <dt>Footprint</dt>
        <dd id="footprint-size"></dd>
        <dt>Area of interest</dt>
        <dd id="area-size">Not drawn yet</dd>
      </dl>
      <button id="draw" type="button" disabled>Draw area of interest</button>
      <button id="download-area" type="button" disabled>Download area of interest</button>
      <button id="cover" type="button" disabled>Save map view as cover image</button>
      <button id="download-footprint" type="button" class="secondary" disabled>Download footprint</button>
    </aside>
  </main>
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.4.0/turf.min.js"></script>
  <script type="module" src="area.js"></script>
</body>
</html>
