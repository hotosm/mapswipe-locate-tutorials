<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Locate area finder</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,300i,400,400i,500,500i,700,700i%7CJetBrains+Mono:400,400i,700,700i&amp;display=fallback">
  <link rel="icon" href="fair-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="builder.css">
</head>
<body>
  <header>
    <h1><a class="logo" href="https://ai.hotosm.org"><img src="fair-logo.svg" alt="fAIr" width="24" height="24"></a>Locate area finder</h1>
    <nav><a href="area.html" aria-current="page">Area finder</a><a href="index.html">Tutorial builder</a><a href="mosaic.html">Imagery merger</a><a href="results.html">Results map</a><a href="boxes.html">Auto labeller</a><a href="../">Back to the guides</a></nav>
  </header>

  <main>
    <form id="setup">
      <div class="card">
        <h2>Load an image</h2>
        <label>
          <span>Image from imagery.hotosm.org, or the tile URL of the imagery merger</span>
          <input id="image" type="text" placeholder="Browse link, TMS URL, image ID or merger tile URL" required>
        </label>
        <div class="actions">
          <button type="submit">Load</button>
          <button id="cancel" type="button" class="secondary">Cancel</button>
        </div>
        <p id="setup-status" aria-live="polite"></p>
        <button id="example" type="button" class="link">Try the Freetown example</button>
      </div>
    </form>
    <div id="map" class="centre-mark"></div>
    <aside>
      <div id="summary"><span id="summary-text"></span><button id="change" type="button" class="secondary">Change</button></div>
      <p id="status" aria-live="polite"></p>
      <fieldset id="zoom-levels" class="choices">
        <legend>Project zoom</legend>
        <label><input type="radio" name="zoom" value="18"> 18</label>
        <label><input type="radio" name="zoom" value="19"> 19</label>
        <label><input type="radio" name="zoom" value="20" checked> 20</label>
        <label><input type="radio" name="zoom" value="21"> 21</label>
      </fieldset>
      <fieldset id="sub-grid" class="choices">
        <legend>Sub-grid</legend>
        <label><input type="radio" name="cells" value="2"> 2x2</label>
        <label><input type="radio" name="cells" value="4" checked> 4x4</label>
        <label><input type="radio" name="cells" value="8"> 8x8</label>
      </fieldset>
      <figure id="volunteer-view" hidden>
        <figcaption>Volunteer view</figcaption>
        <p class="hint">One screen in the app: the tile under the white square in the middle of the map.</p>
        <div id="view-tile">
          <img id="view-image" alt="Tile at the centre of the map">
          <div id="view-cells"></div>
        </div>
        <p id="view-hint" class="hint" hidden>Move the map so the square is over the imagery.</p>
      </figure>
      <dl id="details" hidden>
        <dt>Tile URL for the manager</dt>
        <dd><code id="tile-url"></code><button id="copy-tile-url" type="button" class="secondary">Copy tile URL</button></dd>
        <dt>Cell size</dt>
        <dd id="cell-size"></dd>
        <dt id="images-label">Images</dt>
        <dd id="images"><ol id="image-list"></ol></dd>
        <dt>Area of interest</dt>
        <dd id="area-size"></dd>
      </dl>
      <p id="area-problems" class="problems" aria-live="polite"></p>
      <button id="download-area" type="button" disabled>Download area of interest</button>
      <div class="actions">
        <button id="draw" type="button" class="secondary" aria-pressed="false" disabled>Draw area</button>
        <button id="use-footprint" type="button" class="secondary" disabled>Use footprint</button>
      </div>
      <button id="cover" type="button" class="secondary" disabled>Save map view as cover image</button>
    </aside>
  </main>
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.4.0/turf.min.js"></script>
  <script type="module" src="area.js"></script>
</body>
</html>
