[project]
site_name = "MapSwipe Locate tutorials"
site_url = "https://hotosm.github.io/mapswipe-locate-tutorials/"
site_description = "Step-by-step guides for creating MapSwipe Locate Objects projects and downloading their results."
site_author = "Humanitarian OpenStreetMap Team"
copyright = "Copyright &copy; 2026 Humanitarian OpenStreetMap Team"

extra_css = ["assets/stylesheets/helper-nav.css"]

repo_url = "https://github.com/hotosm/mapswipe-locate-tutorials"
repo_name = "hotosm/mapswipe-locate-tutorials"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Guides" = [
    "guides/index.md",
    { "Check that your object fits" = "guides/check-your-object.md" },
    { "Create a Locate project" = "guides/create-a-project.md" },
    { "Create the tutorial" = "guides/create-the-tutorial.md" },
    { "Publish and check the project" = "guides/publish.md" },
    { "View the results" = "guides/view-results.md" },
    { "Download the results" = "guides/download-results.md" },
    { "Create a training dataset" = [
      "guides/training-data/index.md",
      { "Auto labeller" = "guides/training-data/auto-labeller.md" },
      { "QGIS" = "guides/training-data/qgis.md" },
      { "Label Studio" = "guides/training-data/label-studio.md" },
      { "OpenStreetMap" = "guides/training-data/openstreetmap.md" },
    ] },
    { "What to deliver" = "guides/what-to-deliver.md" },
  ] },
  { "Helpers" = [
    "helpers/index.md",
    { "Area finder" = "builder/area.html" },
    { "Tutorial builder" = "builder/index.html" },
    { "Imagery merger" = "builder/mosaic.html" },
    { "Results map" = "builder/results.html" },
    { "Auto labeller" = "builder/boxes.html" },
    { "Labels checker" = "builder/checker.html" },
  ] },
  { "Example" = [
    { "Solar panels in Freetown" = "examples/freetown-solar-panels.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/hotosm/mapswipe-locate-tutorials"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences = {}
